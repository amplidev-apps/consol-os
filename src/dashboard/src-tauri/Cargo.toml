[package]
name = "consol-home"
version = "0.1.0"
description = "Dash principal do Consol OS — tudo que você joga, num só lugar"
authors = ["amplidev-apps"]
edition = "2021"

[lib]
name = "consol_home_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
