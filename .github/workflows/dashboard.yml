name: Build Consol Home (dashboard)

on:
  push:
    branches: [main]
    paths:
      - 'src/dashboard/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Consol Home
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Instalar dependências do sistema (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/dashboard/src-tauri/target
          key: cargo-${{ hashFiles('src/dashboard/src-tauri/Cargo.lock') }}

      - name: Instalar dependências npm
        working-directory: src/dashboard
        run: npm ci

      - name: Compilar (frontend + backend)
        working-directory: src/dashboard
        # Só .deb por enquanto: o bundler de AppImage baixa ferramentas
        # externas em build-time e falha em rede lenta.
        run: npm run tauri build -- --bundles deb

      - name: Upload dos pacotes
        uses: actions/upload-artifact@v4
        with:
          name: consol-home-linux-${{ github.run_number }}
          path: |
            src/dashboard/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
